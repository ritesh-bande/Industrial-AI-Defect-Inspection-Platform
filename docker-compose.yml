version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vision-postgres
    environment:
      POSTGRES_DB: visioninspect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  mongodb:
    image: mongo:6.0
    container_name: vision-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: always

volumes:
  pgdata:
  mongodata:
