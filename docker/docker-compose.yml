version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: visioninspect_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-visioninspect}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: visioninspect_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: visioninspect_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/visioninspect
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=visioninspect
      - JWT_SECRET_KEY=visioninspect_prod_secret_key_2026_987654321
    volumes:
      - backend_uploads:/app/static/uploads
      - backend_heatmaps:/app/static/heatmaps
      - backend_annotations:/app/static/annotations
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: visioninspect_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: visioninspect_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  mongodb_data:
  backend_uploads:
  backend_heatmaps:
  backend_annotations:
  backend_logs:
